<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoBundesliga Playoffs Season 5</title>

  <link rel="icon" href="icon.png" />
  <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" /> -->
  <link rel="stylesheet" href="../untereReihe/shared-page.css" />
  <style>
    :root {
      --primary-color: #2a2c6b;
      --secondary-color: #74215d;
      --tertiary-color: #1c1e4a;
      --border-radius: 8px;
      --text-color: white;
    }

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html {
      min-height: 100%;
      background: linear-gradient(to bottom right, #1a0033, #660066);
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
    }
    
    /*body {
      min-height: 100vh;
      margin: 0;
      background: transparent;
      color: white;
      text-align: center;
      font-size: larger;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }*/

    body {
      /*background: linear-gradient(to bottom right, #1a0033, #660066);*/
      font-family: Verdana, sans-serif;
      color: white;
      overflow-x: hidden;
      overflow-y: auto;
      background-image: url("hintergrund.png");
      background-size: cover;
      background-position: center;
      background-attachment:fixed
    }


    .card-untere-reihe {
      padding: 30px;
    }

    a {
      text-decoration: none;
    }

    a:hover {
      background-color: #2a2c6b;
      color: #dcd6e0;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Header */
    header {
      background-color: #1a012b;
      padding: 30px 40px;
      flex-shrink: 0;
    }

    header .logo {
      font-weight: bold;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
    }

    header nav a {
      text-decoration: none;
      color: white;
      margin: 0 10px;
    }

    header nav a:hover {
      color: #ffcc00;
      background-color: transparent;
    }

    header .btn-discord {
      background: #4b1d69;
      padding: 6px 12px;
      border-radius: 6px;
      color: white;
      text-decoration: none;
      margin-left: 10px;
    }

    .btn-discord:hover {
      border-color: #9b5de5;
      background-color: #5b2a86;
    }

    /**********************************************************************************************************/

    .bracket-wrapper {
      width: 100%;
      /*height: 100vh;*/
      min-height: calc(100vh - 160px);
      overflow: auto;
      position: relative;
    }

    .bracket {
      display: flex;
      gap: 100px;
      justify-content: center;
      align-items: flex-start;
      position: relative;
      min-width: max-content;
      padding: 40px;
    }

    .round {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      gap: 60px;
      position: relative;
    }

    .round-title {
      text-align: center;
      color: white;/*55d4ff*/
      margin-bottom: 10px;
      font-weight: bold;
      /*text-transform: uppercase;*/
      font-size: 24px;
    }

    .match {
      background-color: #2a2c6b;
      color: white;
      border-radius: 12px;
      padding: 12px;
      min-width: 220px;
      position: relative;
      box-shadow: 0 0 10px #0e1c2f;
      cursor: pointer;
    }

    .team {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
    }

    .vs {
      text-align: center;
      margin: 5px 0;
      color: white;
      font-weight: bold;
    }

    svg {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
      pointer-events: none;
    }

    .modal {
      display: none; /* Standardmäßig versteckt */
      position: fixed;
      z-index: 1000; /* Setzt es im Vordergrund */
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      padding: 1rem;
      background-color: rgba(0, 0, 0, 0.64);
      backdrop-filter: blur(3px);
      justify-content: center;
      align-items: center;
    }

    /* Modal-Inhalt */
    .modal-content {
      background-color: #2b2a2c;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.42);
      color: white;
      max-height: 86vh;
      overflow: auto;
      padding: 1.2rem;
      width: min(760px, calc(100% - 32px));
      margin: auto;
      text-align: left;
      position: relative;
    }

    .modal-content h2 {
      color: white;
      font-size: clamp(1.35rem, 1rem + 1vw, 1.75rem);
      line-height: 1.2;
      margin: 0 2.5rem 1rem;
      text-align: center;
    }

    .modal-content p {
      color: #f0f3f7;
    }

    #modalDetails strong {
      color: #ffcc00;
    }

    .close {
      position: absolute;
      align-items: center;
      background-color: #330351;
      border-radius: 8px;
      color: white;
      display: inline-flex;
      height: 36px;
      justify-content: center;
      line-height: 1;
      right: 1rem;
      top: 1rem;
      width: 36px;
      font-size: 22px;
      cursor: pointer;
    }

    .close:hover,
    .close:focus {
      background-color: #2a2c6b;
      color: #dcd6e0;
    }

    .game-profile {
      align-items: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      display: flex;
      gap: 1rem;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding: 1rem;
      text-align: left;
    }

    .game-player-line {
      align-items: center;
      color: #dcd6e0;
      display: flex;
      flex-wrap: wrap;
      font-size: 1.25rem;
      font-weight: 900;
      gap: 0.5rem;
      margin-top: 0.2rem;
    }

    .blue-player { color: #76a9ff; }
    .red-player { color: #ff8d8d; }

    .game-status {
      background-color: #330351;
      border-radius: 8px;
      color: white;
      flex-shrink: 0;
      font-weight: 900;
      padding: 0.7rem 0.9rem;
    }

    .game-profile.open .game-status {
      background-color: rgba(255, 255, 255, 0.1);
      color: #dcd6e0;
    }

    .stats-section {
      margin-top: 1rem;
      text-align: left;
    }

    .stats-section h3 {
      color: white;
      font-size: 1rem;
      margin: 0 0 0.55rem;
    }

    .stats-eyebrow,
    .stats-stat-label {
      color: #dcd6e0;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .game-stat-grid {
      display: grid;
      gap: 0.65rem;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .stats-stat {
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0.75rem;
    }

    .stats-stat-value {
      color: white;
      font-size: 1.28rem;
      line-height: 1.1;
    }

    #maps-container,
    .maps-container {
      align-items: center;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-top: 0 !important;
    }

    .maps-row {
      display: grid;
      gap: 0.65rem;
      justify-content: center;
      width: 100%;
    }

    .maps-row-1 { grid-template-columns: minmax(150px, min(240px, 100%)); }
    .maps-row-2 { grid-template-columns: repeat(2, minmax(150px, 220px)); }
    .maps-row-3 { grid-template-columns: repeat(3, minmax(150px, 1fr)); max-width: 720px; }

    .map-card {
      background-color: rgba(0, 0, 0, 0.18) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-left: 5px solid rgba(255, 255, 255, 0.16) !important;
      border-radius: 8px !important;
      color: white !important;
      display: flex !important;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 0 !important;
      padding: 0.75rem !important;
      text-align: left !important;
      text-decoration: none !important;
      height: 100%;
    }

    .map-card.blue-win { border-left-color: #477dff !important; }
    .map-card.red-win { border-left-color: #ff5e5e !important; }
    .map-card:hover { background-color: #2a2c6b !important; }

    .map-number,
    .map-meta {
      color: #dcd6e0 !important;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .map-number { text-transform: uppercase; }

    .game-empty-state {
      background: rgba(0, 0, 0, 0.18);
      border: 1px dashed rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      color: #dcd6e0;
      grid-column: 1 / -1;
      padding: 1rem;
      text-align: center;
    }

    @media (max-width: 767.98px) {
      .modal-content { width: min(92vw, 600px); }
      .game-stat-grid { grid-template-columns: 1fr; }
      .game-profile { align-items: stretch; flex-direction: column; }
    }

    .player-pill {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--tertiary-color); /*#1e293b;*/
      border-radius: 999px;
      border: 1px solid #55d4ff;/*55d4ff 5ce1e6*/
      padding: 6px 12px;
      width: 100%;
      box-sizing: border-box;
    }

    .player-pill .name {
      font-weight: 500;
      color: white;
    }

    .player-pill .score {
      font-weight: bold;
      color: white;/*55d4ff*/
    }

    .player-pill.winner {
      background-color: #16a34a; /*16a34a*/
      border-color: #22c55e;/*22c55e*/
      color: #fff;
    }

    .player-pill.winner .score {
      color: #ffffff;
      font-weight: bold;
    }

    .player-pill.winner .name {
      font-weight: bold;
    }

    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .button {
      background-color: var(--primary-color);/*#330351;*/
      color: var(--text-color);
      padding: 1vh 2vw;
      font-size: 1.5vw;
      border-radius: var(--border-radius);
      text-decoration: none;
      box-shadow: 0 0 10px #0e1c2f;
      border-radius: 12px;
    } 

    .button:hover{
      color: #ffcc00;
    }

    .button-container .button {
      text-align: center;
      padding: 1em;
      font-size: clamp(0.9rem, 3.5vw, 1.2rem);
      justify-content: center;
    }

    .button-container {
      display: flex;
      justify-content: center;  
      margin-top: 20px;      
    }

  </style>
</head>

  <section class="text-center mt-5">
    <h1 style="font-size: 2.5rem; font-weight: bold; text-align: center; margin-top: 20px;">Geo Bundesliga Playoffs</h1>
  </section>


  <div class="button-container">
    <a href="https://forms.gle/S7MWo9DwqfcuoE7n8" class="button" target="_blank">
      <span>Spiel einreichen</span>
    </a>
  </div>

  <div class="bracket-wrapper">
    <div class="bracket" id="bracket">
      <div class="round">
        <div class="round-title">Viertelfinale</div>
        <div class="match" id="match-vf1"></div>
        <div class="match" id="match-vf2"></div>
        <div class="match" id="match-vf3"></div>
        <div class="match" id="match-vf4"></div>
      </div>
      <div class="round">
        <div class="round-title">Halbfinale</div>
        <div style="height: 37px;"></div><!--20px/ -->
        <div class="match" id="match-hf1"></div>
        <div style="height: 128px;"></div><!--27px/ -->
        <div class="match" id="match-hf2"></div>
        <div style="height: 38px;"></div><!--27px/ -->
      </div>
      <div class="round">
        <div class="round-title">Finale in Berlin</div>
        <div style="height: 233px;"></div><!--140px/ -->
        <div class="match" id="match-final"></div>
        <div style="height: 233px;"></div><!--140px/ -->
      </div>
    </div>
    <svg id="lines"></svg>
  </div>
  </main>
  <!-- Modal-Container -->
  <div id="gameModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closePopup()">&times;</span>
      <h2 id="modalTitle">Spielinformationen</h2>
      <p id="modalDetails">Details zum Spiel werden hier angezeigt.</p>
    </div>
  </div>

  <script>
    const sheetID = "1Ign2YJZ0edrj6ZH1Kd3d3qJ4dr4XWSiAAofW94hIobE";
    const spreadsheetName = "Playoffs_Relegation";
    const range = "A2:H13";
    const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?sheet=${spreadsheetName}&range=${range}`;

    const matchMap = {
      "Viertelfinale 1": "match-vf1",
      "Viertelfinale 2": "match-vf2",
      "Viertelfinale 3": "match-vf3",
      "Viertelfinale 4": "match-vf4",
      "Halbfinale 1": "match-hf1",
      "Halbfinale 2": "match-hf2",
      "Finale": "match-final",
    };

    function formatMatchType(matchtype) {
      if (matchtype == "move") return "Moving";
      if (matchtype == "ppd") return "Pinpointing Duel";
      if (matchtype == "no move") return "NM";
      return "NMPZ";
    }

    function renderMatchMaps(maps) {
      if (!maps || maps.length === 0) {
        return `
          <div id="maps-container" class="maps-container empty">
            <div class="game-empty-state">Noch keine Mapdetails verfügbar.</div>
          </div>
        `;
      }

      const rows = [maps.slice(0, 2), maps.slice(2, 5), maps.slice(5)];

      const renderMapCard = (mapInfo, index) => {
        // Unterstützt sowohl [name, winner, matchtype, link] (4 Werte)
        // als auch [name, winner, matchtype, health, link] (5 Werte)
        const [mapName, winner, matchtype, fourth, fifth] = mapInfo;
        const health = mapInfo.length >= 5 ? fourth : null;
        const link = mapInfo.length >= 5 ? fifth : fourth;
        const winnerClass =
          winner === "blue" ? "blue-win" : winner === "red" ? "red-win" : "";
        const mapCardContent = `
          <span class="map-number">Map ${index + 1}</span>
          <strong>${mapName}</strong>
          <span class="map-meta">${formatMatchType(matchtype)}${
          health ? ` · ${health} Health` : ""
        }</span>
        `;

        return link
          ? `<a class="map-card ${winnerClass}" href="${link}" target="_blank" rel="noopener">${mapCardContent}</a>`
          : `<div class="map-card ${winnerClass}">${mapCardContent}</div>`;
      };

      return `
        <div id="maps-container" class="maps-container">
          ${rows
            .map((row, rowIndex) => {
              const previousMaps = rows
                .slice(0, rowIndex)
                .reduce((total, previousRow) => total + previousRow.length, 0);

              return row.length
                ? `<div class="maps-row maps-row-${row.length}">${row
                    .map((mapInfo, mapIndex) =>
                      renderMapCard(mapInfo, previousMaps + mapIndex)
                    )
                    .join("")}</div>`
                : "";
            })
            .join("")}
        </div>
      `;
    }

    function openModal(matchData) {
      const modal = document.getElementById('gameModal');
      const modalDetails = document.getElementById('modalDetails');
      const played = matchData.score && matchData.score !== "N/A";
      const statusClass = played ? "played" : "open";

      modalDetails.innerHTML = `
        <div class="game-profile ${statusClass}">
          <div>
            <span class="stats-eyebrow">${played ? "Gespielt" : "Ausstehend"}</span>
            <div class="game-player-line">
              <span class="blue-player">${matchData.blau}</span>
              <span>vs</span>
              <span class="red-player">${matchData.rot}</span>
            </div>
          </div>
          <span class="game-status">${played ? matchData.score : "Noch offen"}</span>
        </div>

        <section class="stats-section">
          <h3>Match</h3>
          <div class="game-stat-grid">
            <div class="stats-stat">
              <span class="stats-stat-label">Runde</span>
              <strong class="stats-stat-value">${matchData.round || "N/A"}</strong>
            </div>
            <div class="stats-stat">
              <span class="stats-stat-label">Match ID</span>
              <strong class="stats-stat-value">${matchData.matchid || "N/A"}</strong>
            </div>
            <div class="stats-stat">
              <span class="stats-stat-label">Ergebnis</span>
              <strong class="stats-stat-value">${played ? matchData.score : "Offen"}</strong>
            </div>
          </div>
        </section>

        <section class="stats-section">
          <h3>Maps</h3>
          ${renderMatchMaps(matchData.maps)}
        </section>
      `;

      modal.style.display = 'flex';
    }

    function closePopup() {
      document.getElementById("gameModal").style.display = "none";
    }

    window.addEventListener("click", function (event) {
      const modal = document.getElementById("gameModal");
      if (event.target === modal) {
        closePopup();
      }
    });

    function fetchSheetData() {
      fetch(url)
        .then(res => res.text())
        .then(text => JSON.parse(text.substr(47).slice(0, -2)))
        .then(jsonData => {
          const matchData = jsonData.table.rows.map(row => ({
            round: row.c[0]?.v || "Unbekannt",
            blau: row.c[1]?.v || "-",
            rot: row.c[2]?.v || "-",
            score: row.c[3]?.v || "N/A",
            winner: row.c[4]?.v || "-",
            maps: JSON.parse(row.c[5]?.v || "[]"),
            matchid: row.c[6]?.v || "Unbekannt",
          }));

          matchData.forEach(match => {
            const id = matchMap[match.round];
            if (!id) return;
            const matchBox = document.getElementById(id);
            const [score1, score2] = match.score.split(":");
            const isWinner1 = match.blau === match.winner;
            const isWinner2 = match.rot === match.winner;
            matchBox.innerHTML = `
              <div class="team">
                <div class="player-pill ${isWinner1 ? 'winner' : ''}">
                  <span class="name">${match.blau}</span>
                  <span class="score">${score1}</span>
                </div>
              </div>
              <div class="vs">VS</div>
              <div class="team">
                <div class="player-pill ${isWinner2 ? 'winner' : ''}">
                  <span class="name">${match.rot}</span>
                  <span class="score">${score2}</span>
                </div>
              </div>
            `;

            matchBox.onclick = () => openModal(match);
          });
        });
    }

    function curvedPath(x1, y1, x2, y2) {
      const midX = (x1 + x2) / 2;
      return `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`;
    }

    function rightAnglePath(x1, y1, x2, y2) {
      const midX = (x1 + x2) / 2;
      return `M ${x1} ${y1} H ${midX} V ${y2} H ${x2}`;
    }

    function connect(fromId, toId) {
      const from = document.getElementById(fromId);
      const to = document.getElementById(toId);
      if (!from || !to) return;

      const bracket = document.querySelector('.bracket');
      const fRect = from.getBoundingClientRect();
      const tRect = to.getBoundingClientRect();
      const bRect = bracket.getBoundingClientRect();

      const x1 = fRect.right - bRect.left;
      const y1 = fRect.top + fRect.height / 2 - bRect.top;
      const x2 = tRect.left - bRect.left;
      const y2 = tRect.top + tRect.height / 2 - bRect.top;

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", curvedPath(x1, y1, x2, y2));
      path.setAttribute("stroke", "#55d4ff");//2e90ff //55d4ff
      path.setAttribute("stroke-width", "2");
      path.setAttribute("fill", "none");

      document.getElementById('lines').appendChild(path);
    }

    function drawLines() {
      const svg = document.getElementById('lines');
      const bracket = document.querySelector('.bracket');
      svg.innerHTML = '';
      svg.setAttribute("width", bracket.scrollWidth);
      svg.setAttribute("height", bracket.scrollHeight);

      connect("match-vf1", "match-hf1");
      connect("match-vf2", "match-hf1");
      connect("match-vf3", "match-hf2");
      connect("match-vf4", "match-hf2");
      connect("match-hf1", "match-final");
      connect("match-hf2", "match-final");
    }

    window.onload = () => {
      fetchSheetData();
      setTimeout(() => {
        requestAnimationFrame(drawLines);
      }, 1000);
    };
    window.onresize = drawLines;

  </script>
